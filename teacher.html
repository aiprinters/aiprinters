<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Printers | ID Card Request</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.teacher-card{width:min(620px,100%);background:#fff;border:1px solid #e8ecf2;border-radius:16px;padding:32px;box-shadow:0 16px 40px #26324912}.teacher-brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}.teacher-brand strong{font:600 18px Outfit}.teacher-brand span{background:#316bff;color:#fff;border-radius:9px;padding:10px;font-weight:700}.teacher-card h1{font-size:27px}.teacher-card p{color:#748094;font-size:14px;line-height:1.5}.teacher-form label{display:grid;gap:7px;font-size:12px;font-weight:600;color:#526075;margin:15px 0}.teacher-form input,.teacher-form select,.teacher-form textarea{border:1px solid #dce2eb;border-radius:7px;padding:11px;font:14px "DM Sans";width:100%}.teacher-form textarea{resize:vertical}.notice{padding:12px;border-radius:8px;background:#e2f7ed;color:#18875a;font-size:13px}.error{background:#fff0ef;color:#bf3e3e}</style></head>
<body><section class="teacher-card"><div class="teacher-brand"><span>AI</span><strong>AI Printers</strong></div><div id="loading"><h1>Loading request form…</h1><p>Please wait a moment.</p></div><div id="formArea" hidden><p class="eyebrow">ID CARD REQUEST</p><h1 id="schoolName"></h1><p>Submit a new request or request a replacement. AI Printers will update the status after receiving it.</p><form class="teacher-form" id="teacherForm"><label>Teacher's name *<input id="teacherName" required></label><label>Teacher's contact number *<input id="teacherContact" type="tel" required></label><div id="fields"></div><label>Request type *<select name="request_type" required><option>New admission</option><option>Lost card</option><option>Damaged card</option><option>Correction</option></select></label><label>Student photograph *<input type="file" id="photo" accept="image/*" required></label><label>Notes (optional)<textarea id="notes" rows="3" placeholder="Any special instruction for the ID card"></textarea></label><button class="button primary full" id="submit">Submit request</button></form><div id="message" hidden></div></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="teacher.js"></script></body></html>
