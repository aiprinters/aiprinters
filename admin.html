<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ai Printers | Admin</title><link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#131c30;--blue:#1f6fd6;--magenta:#e6197f;--yellow:#f3b524;--green:#18905e;--line:#e8ecf2;--muted:#5b6779}
body{background:#f5f7fb;padding:0;font-family:"DM Sans",sans-serif}
#app{max-width:1200px;margin:auto;padding:28px}
.login{max-width:440px;margin:9vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px;box-shadow:0 16px 40px #13203012;text-align:center}
.login img{height:48px;margin-bottom:16px}
.login input{width:100%;padding:11px;border:1px solid #dce2eb;border-radius:8px;margin:12px 0;font:14px "DM Sans"}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:14px}
.cards article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 14px #13203006}
.cards p{color:var(--muted);font-size:13px}
.manage-form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:12px;display:grid;gap:12px;box-shadow:0 4px 14px #13203006}
.manage-form h2{font:700 17px Outfit;margin:0}
.manage-form input,.manage-form textarea{padding:10px;border:1px solid #dce2eb;border-radius:8px;font:14px "DM Sans"}
.linkbox{font-size:11px;word-break:break-all;background:#f5f7fb;padding:8px;border-radius:6px}
.card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin:6px 0 4px}
.tab-btn{padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font:600 13px "DM Sans";color:var(--muted)}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab-panel{display:none}.tab-panel.active{display:block}
.request-card{display:flex;gap:14px;align-items:flex-start;position:relative}
.request-photo{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#f0f2f6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#98a1b0;text-align:center}
.request-photo img{width:100%;height:100%;object-fit:cover}
.request-info{flex:1;min-width:0}.request-info h3{margin:0 0 4px;font:600 15px Outfit}.request-info p{margin:2px 0}
.field-row{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;background:#fafbfc}
.field-row input[type=text]{flex:1;border:0;background:transparent;padding:4px;min-width:0;font:13px "DM Sans"}
.field-row label{display:flex;align-items:center;gap:4px;font-size:11px;margin:0;white-space:nowrap}
.field-row button{border:0;background:none;color:#d74d50;font-size:16px;cursor:pointer}
.shell{display:flex;gap:24px;align-items:flex-start}
.dashsidebar{width:190px;background:var(--navy);border-radius:16px;padding:20px 14px;display:flex;flex-direction:column;gap:20px;flex-shrink:0;box-shadow:0 10px 26px #13203020}
.sidebrand{display:flex;align-items:center;gap:9px;padding:0 6px}
.sidebrand img{height:30px}.sidebrand b{color:#fff;font:700 13px Outfit;display:block;line-height:1.15}.sidebrand span{color:#8791ac;font-size:8.5px;letter-spacing:.5px}
.nav-item{text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:9px;cursor:pointer;font:600 13px "DM Sans";color:#aab3c9}
.nav-item.active{background:#1e2a47;color:#fff}
.main-area{flex:1;min-width:0}
.section{display:none}.section.active{display:block}
.badge{background:var(--magenta);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-left:4px}
.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
.toolbar select{padding:9px;border:1px solid #dce2eb;border-radius:8px;font:13px "DM Sans"}
.req-check{position:absolute;top:0;right:0}
.search-row{display:flex;gap:8px;margin-top:14px}
#schoolSearch{flex:1;padding:10px;border:1px solid #dce2eb;border-radius:8px;font:14px "DM Sans"}
.group-heading{margin:24px 0 6px;font:600 15px Outfit;color:var(--navy)}
.group-heading:first-child{margin-top:8px}
#statsBar article{text-align:center}
h1,h2,h3{font-family:Outfit}
</style></head>
<body><main id="app">
<div id="login" class="login"><img src="logo.png" alt="Ai Printers"><p class="eyebrow">AI PRINTERS</p><h1>Online admin access</h1><p class="hint">Enter your email. Supabase will send you a secure sign-in link.</p><input id="email" type="email" placeholder="Your email address"><button id="sendLogin" class="button primary full">Send secure sign-in link</button><p id="loginMessage" class="hint"></p></div>

<div id="admin" hidden class="shell">
<aside class="dashsidebar">
  <div class="sidebrand"><img src="logo.png" alt=""><div><b>Ai Printers</b><span>AWESOME IMAGINATION</span></div></div>
  <nav><button class="nav-item active" data-section="idcards">🪪 ID Cards</button><button class="nav-item" data-section="servicescat">🗂️ Services Catalog</button></nav>
  <button id="signOut" class="button outline">Sign out</button>
</aside>
<div class="main-area">
<section id="idcards" class="section active">
<div id="statsBar" class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:6px"></div>
<div class="tabs"><button class="tab-btn active" data-tab="schoolsTab">Schools</button><button class="tab-btn" data-tab="requestsTab">Requests <span id="reqBadge" class="badge" hidden></span></button></div>
<div id="schoolsTab" class="tab-panel active">
<div class="manage-form"><h2>Add a school</h2><input id="name" placeholder="School name"><input id="contact" placeholder="Contact person (optional)"><input id="accessCode" placeholder="Private school code, e.g. GREEN-2026"><textarea id="fieldNames" rows="3" placeholder="Fields, separated by commas: Student name, Admission number, Class, Section, Date of birth"></textarea><button id="addSchool" class="button primary">Save school and create link</button><p id="adminMessage" class="hint"></p></div>
<div class="search-row"><input id="schoolSearch" placeholder="Search schools by name..."><button id="clearSearch" class="button outline" type="button">Show all</button></div>
<div id="schoolList" class="cards"></div>
</div>
<div id="requestsTab" class="tab-panel">
<div class="toolbar">
<input id="reqSearch" placeholder="Search student/school..." style="padding:9px;border:1px solid #dce2eb;border-radius:8px;font:13px 'DM Sans'">
<select id="filterSchool"><option value="">All schools</option></select>
<select id="filterStatus"><option value="">All statuses</option><option>Received</option><option>Under Printing</option><option>Printed</option><option>Delivered</option></select>
<select id="sortOrder"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select>
<button id="clearReqFilters" class="button outline" type="button">Clear filters</button>
</div>
<div class="toolbar"><select id="bulkStatus"><option value="">Set status for selected…</option><option>Received</option><option>Under Printing</option><option>Printed</option><option>Delivered</option></select><button id="applyBulk" class="button outline">Apply to selected</button><button id="exportCsv" class="button outline">Export CSV</button></div>
<div id="requestsList"></div>
</div>
</section>
<section id="servicescat" class="section">
<div class="manage-form"><h2>Add a service</h2><input id="svcIcon" placeholder="Icon (emoji), e.g. 🖨️"><input id="svcName" placeholder="Service name, e.g. Sublimation"><button id="addService" class="button primary">Add service</button><p id="svcMessage" class="hint"></p></div>
<div id="servicesList" class="cards" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div>
</section>
</div>
</div>

<dialog id="editDialog"><form method="dialog" id="editForm" class="modal"><div class="modal-head"><div><p class="eyebrow">SCHOOL SETTINGS</p><h2>Edit school</h2></div><button class="close" value="cancel">×</button></div><input type="hidden" id="editId"><label>School name<input id="editName" required></label><label>Contact person (optional)<input id="editContact"></label><label>Private access code<input id="editAccessCode" required></label><label>Student detail fields<div id="editFields"></div><button type="button" class="button outline" id="addEditField">+ Add field</button></label><p id="editMessage" class="hint"></p><div class="modal-actions"><button class="button outline" value="cancel">Cancel</button><button class="button primary" value="save">Save changes</button></div></form></dialog>
<dialog id="confirmDialog"><div class="modal"><div class="modal-head"><div><p class="eyebrow">CONFIRM</p><h2>Are you sure?</h2></div></div><p id="confirmText" class="hint"></p><div class="modal-actions"><button class="button outline" id="confirmCancel" type="button">Cancel</button><button class="button primary" id="confirmYes" type="button" style="background:#d74d50">Yes, delete</button></div></div></dialog>
<dialog id="productsDialog" style="max-width:640px"><div class="modal"><div class="modal-head"><div><p class="eyebrow">PRODUCTS</p><h2 id="productsTitle">Category</h2></div><button class="close" id="closeProducts" type="button">×</button></div>
<div style="display:grid;gap:8px;margin-bottom:16px">
<input id="prodTitle" placeholder="Product title">
<textarea id="prodDesc" rows="2" placeholder="Description (optional)"></textarea>
<input id="prodRate" type="number" placeholder="Rate (₹)">
<input id="prodPhoto" type="file" accept="image/*">
<button id="addProduct" class="button primary">Add product</button>
<p id="prodMessage" class="hint"></p>
</div>
<div id="productsList" class="cards" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div>
</div></dialog>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
