<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Printers | Online Admin</title><link rel="stylesheet" href="styles.css"><style>body{background:#f7f8fb;padding:34px}#app{max-width:1050px;margin:auto}.login{max-width:460px;margin:10vh auto;background:#fff;border:1px solid #e8ecf2;border-radius:14px;padding:30px}.login input{width:100%;padding:11px;border:1px solid #dce2eb;border-radius:7px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}.cards article{background:#fff;border:1px solid #e8ecf2;border-radius:12px;padding:20px}.cards p{color:#748094;font-size:13px}.manage-form{background:#fff;border:1px solid #e8ecf2;border-radius:12px;padding:22px;margin-top:22px;display:grid;gap:12px}.manage-form input,.manage-form textarea{padding:10px;border:1px solid #dce2eb;border-radius:7px;font:14px "DM Sans"}.linkbox{font-size:11px;word-break:break-all;background:#f5f7fb;padding:8px;border-radius:5px}.card-actions{display:flex;gap:8px;margin-top:10px}.tabs{display:flex;gap:8px;margin:22px 0 4px}.tab-btn{padding:9px 16px;border:1px solid #dce2eb;background:#fff;border-radius:8px;cursor:pointer;font:600 13px "DM Sans";color:#526075}.tab-btn.active{background:#316bff;color:#fff;border-color:#316bff}.tab-panel{display:none}.tab-panel.active{display:block}.request-card{display:flex;gap:14px;align-items:flex-start}.request-photo{width:64px;height:64px;border-radius:8px;overflow:hidden;background:#f0f2f6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#98a1b0;text-align:center}.request-photo img{width:100%;height:100%;object-fit:cover}.request-info h3{margin:0 0 4px;font-size:15px}.request-info p{margin:2px 0}</style></head><body><main id="app"><div id="login" class="login"><p class="eyebrow">AI PRINTERS</p><h1>Online admin access</h1><p class="hint">Enter your email. Supabase will send you a secure sign-in link.</p><input id="email" type="email" placeholder="Your email address"><button id="sendLogin" class="button primary full">Send secure sign-in link</button><p id="loginMessage" class="hint"></p></div><section id="admin" hidden><header><div><p class="eyebrow">ONLINE WORKSPACE</p><h1>Schools & teacher links</h1></div><button id="signOut" class="button outline">Sign out</button></header><div class="tabs"><button class="tab-btn active" data-tab="schoolsTab">Schools</button><button class="tab-btn" data-tab="requestsTab">Requests</button></div><div id="schoolsTab" class="tab-panel active"><div class="manage-form"><h2>Add a school</h2><input id="name" placeholder="School name"><input id="contact" placeholder="Contact person (optional)"><input id="accessCode" placeholder="Private school code, e.g. GREEN-2026"><textarea id="fieldNames" rows="3" placeholder="Fields, separated by commas: Student name, Admission number, Class, Section, Date of birth"></textarea><button id="addSchool" class="button primary">Save school and create link</button><p id="adminMessage" class="hint"></p></div><div id="schoolList" class="cards"></div></div><div id="requestsTab" class="tab-panel"><div id="requestsList" class="cards"></div></div></section><dialog id="editDialog"><form method="dialog" id="editForm" class="modal"><div class="modal-head"><div><p class="eyebrow">SCHOOL SETTINGS</p><h2>Edit school</h2></div><button class="close" value="cancel">×</button></div><input type="hidden" id="editId"><label>School name<input id="editName" required></label><label>Contact person (optional)<input id="editContact"></label><label>Private access code<input id="editAccessCode" required></label><p id="editMessage" class="hint"></p><div class="modal-actions"><button class="button outline" value="cancel">Cancel</button><button class="button primary" value="save">Save changes</button></div></form></dialog></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
